[project]
name = "griptape-nodes-library-advanced-media"
version = "0.66.8"
description = "Advanced media generation and manipulation nodes for Griptape Nodes."
authors = [
    {name = "Griptape, Inc."}
]
requires-python = "~=3.12.0"
# Edit-time dependencies only: what importing the node modules on the orchestrator needs. The
# packages that only `process()` touches are declared in `pip_dependencies_exec` in
# griptape_nodes_library.json, which the engine installs additively into `.venv-exec`. They are
# deliberately absent here: an extra or group would be co-resolved with the engine's own closure
# into this one lockfile, and the two sets are not co-satisfiable.
dependencies = [
    "griptape[drivers-prompt-amazon-bedrock,drivers-prompt-anthropic,drivers-prompt-cohere,drivers-prompt-ollama,drivers-web-scraper-trafilatura,drivers-web-search-duckduckgo,drivers-web-search-exa,loaders-image]>=1.9.4",
    "numpy>=2.2.4",
    "pillow>=11.2.1",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "artifact_utils",
    "controlnet_aux_nodes_library",
    "diffusers_nodes_library",
    "dino_sam2_library",
    "opencv_nodes_library",
    "openpose_nodes_library",
    "pillow_nodes_library",
    "spandrel_nodes_library",
    "transformers_nodes_library",
    "utils",
    "workflows",
]

# `uv sync` equivalent of the JSON's `--torch-backend=auto`: pull CUDA torch
# wheels on Windows/Linux, fall back to PyPI (MPS build) on macOS.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest", "griptape-nodes-engine>=0.77.5"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
reportMissingImports = false
reportMissingModuleSource = false
reportAttributeAccessIssue = false
reportPrivateImportUsage = false
reportCallIssue = false
reportArgumentType = false
reportOptionalSubscript = false
reportReturnType = false
reportOptionalCall = false
reportGeneralTypeIssues = false
reportIndexIssue = false
reportAssignmentType = false
